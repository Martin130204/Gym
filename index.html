<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2774E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Bitácora de Hierro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#ECEEE9; --surface:#F8F9F6; --surface2:#E2E5DF; --ink:#15181B; --muted:#5B6268; --line:#D1D5CD;
  --accent:#1F4FB8; --accent-ink:#FFFFFF; --soft:#DCE4F5;
  --pr:#C3302A; --good:#2E7A4D; --warn:#A96F12; --warn-soft:#F4E8D2; --good-soft:#DCEEE2; --pr-soft:#F6DEDC;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101316; --surface:#191D21; --surface2:#23282D; --ink:#E7E9E5; --muted:#9AA1A7; --line:#2C3237;
    --accent:#7098F2; --accent-ink:#0B1222; --soft:#1C2944;
    --pr:#EE6B60; --good:#5DC18B; --warn:#E1A94B; --warn-soft:#342A17; --good-soft:#16301F; --pr-soft:#3A1D1B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101316; --surface:#191D21; --surface2:#23282D; --ink:#E7E9E5; --muted:#9AA1A7; --line:#2C3237;
  --accent:#7098F2; --accent-ink:#0B1222; --soft:#1C2944;
  --pr:#EE6B60; --good:#5DC18B; --warn:#E1A94B; --warn-soft:#342A17; --good-soft:#16301F; --pr-soft:#3A1D1B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding:env(safe-area-inset-top,0px) 16px calc(84px + env(safe-area-inset-bottom,0px))}
button.linkish{background:none;border:none;padding:0;font:inherit;cursor:pointer}
/* login */
.login{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 24px}
.login .in{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.login .msg{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--soft)}
.login .msg.err{background:var(--pr-soft);color:var(--pr)}
.wrap{max-width:720px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.err{background:var(--pr-soft);color:var(--pr)}
h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:22px 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px;min-width:0}
.row.tight > *{flex:0 0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0;max-width:100%}
/* Safari en iPhone le da un ancho mínimo propio al selector de fecha y se sale de su columna */
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
button.small{padding:6px 10px;font-size:14px}
button.dashed{border-style:dashed;background:transparent;color:var(--accent);width:100%}
button.danger{color:var(--pr)}
button.armed{background:var(--pr);border-color:var(--pr);color:#fff}
button:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:none;background:transparent;color:var(--muted);padding:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.week i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:var(--accent-ink)}
.week i.on{background:var(--accent)}
.week i.today{box-shadow:inset 0 0 0 2px var(--ink)}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.wk-head .big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
/* ejercicios */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-head input{font-weight:600}
.ex-last{font-size:13px;color:var(--muted)}
.ex-last b{color:var(--ink);font-weight:600}
.sug{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface2);display:flex;gap:8px;align-items:flex-start}
.sug.up{background:var(--good-soft)}
.sug.down{background:var(--warn-soft)}
.sug b{font-weight:600}
.sets{display:grid;grid-template-columns:24px 1fr 1fr 66px 28px;gap:6px 6px;align-items:center}
.exmeta{display:grid;grid-template-columns:92px 1fr;gap:8px}
.exmeta select,.exmeta input{padding:8px 9px;font-size:14px}
.eff{padding:8px 2px;font-size:12px;font-weight:600;border-radius:8px;background:transparent;color:var(--muted);border:1px dashed var(--line)}
.eff.facil{background:var(--good-soft);color:var(--good);border:1px solid transparent}
.eff.justo{background:var(--warn-soft);color:var(--warn);border:1px solid transparent}
.eff.fallo{background:var(--pr-soft);color:var(--pr);border:1px solid transparent}
.sets .h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.sets .n{font-family:var(--mono);color:var(--muted);text-align:center;font-size:14px}
.sets input{text-align:center;font-family:var(--mono);padding:9px 4px}
.sets .x{padding:6px;border:none;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--pr-soft);color:var(--pr);white-space:nowrap}
.badge.blue{background:var(--soft);color:var(--accent)}
.badge.green{background:var(--good-soft);color:var(--good)}
.badge.grey{background:var(--surface2);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.savebar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.savebar .st{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05}
.stat .v small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
/* calendario */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.cal button{aspect-ratio:1;max-width:100%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:8px;border:1px solid transparent;background:var(--surface2);color:var(--ink);font-family:var(--mono);font-size:13px;font-weight:500}
.cal button.out{visibility:hidden}
.cal button.went{background:var(--accent);color:var(--accent-ink)}
.cal button.miss{background:transparent;border-color:var(--pr);color:var(--pr)}
.cal button.today{border-color:var(--ink)}
.cal button .t{font-family:var(--body);font-size:9px;font-weight:600;text-transform:uppercase;line-height:1}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* historial */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sess summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.sess summary::-webkit-details-marker{display:none}
.sess .date{font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.sess .meta{font-size:13px;color:var(--muted)}
.sess .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tbl td.r,.tbl th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-left:10px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
/* metas */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal .title{font-weight:600;font-size:17px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:5px}
.goal.done .bar > span{background:var(--good)}
.tip{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.tip.good{background:var(--good-soft)}
.tip.info{background:var(--soft)}
.tip b{font-weight:600}
/* rutinas */
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.day-head{display:flex;gap:8px;align-items:center}
.day-head input{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.rex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.rex-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rex-top .name{font-weight:600}
.rex-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:460px){.rex-grid{grid-template-columns:repeat(3,1fr)}}
.rex-grid label{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rex-grid input{padding:7px 4px;text-align:center;font-family:var(--mono)}
.iconbtn{border:none;background:transparent;color:var(--muted);padding:4px 7px;font-size:17px;line-height:1}
.rlist .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rlist .item:last-child{border-bottom:none}
/* selector de ejercicios */
.picker{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.picker .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.picker .ph{position:sticky;top:0;background:var(--bg);padding-bottom:8px;display:flex;flex-direction:column;gap:8px;z-index:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:0 0 auto;padding:6px 11px;font-size:13px;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font-weight:500;padding:11px 12px}
.pick small{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:none;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){ .bar > span{transition:width .4s ease} }
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <div class="in">
    <div class="brand">Bitácora de Hierro<small>Entra para ver tus datos en el celular y en el computador</small></div>
    <div class="msg" id="login-msg" hidden></div>
    <form id="login-form" class="stack" novalidate>
      <label class="f"><span class="label" id="l-id-label">Email o usuario</span><input id="l-email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <label class="f" id="l-user-wrap" hidden><span class="label">Nombre de usuario</span><input id="l-user" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="3 a 20 letras, números, punto o guion bajo"></label>
      <label class="f"><span class="label">Contraseña</span><input id="l-pass" type="password" autocomplete="current-password"></label>
      <button class="primary" type="submit" id="l-in">Entrar</button>
      <button type="button" id="l-mode">Crear cuenta nueva</button>
    </form>
    <p class="hint" style="margin:0">Cada cuenta tiene sus propios datos. Otra persona puede crear su cuenta y llevar su propio registro.</p>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="brand">Bitácora de Hierro<small>Registro de entrenamiento</small></div>
    <span class="chip" id="sync"><span class="dot"></span><span id="sync-t">Conectando…</span></span>
  </header>
  <main id="view"></main>
</div>
<div class="picker" id="picker" hidden></div>
<datalist id="ex-list"></datalist>
<div class="toast" id="toast" hidden></div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="registrar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Hoy</button>
    <button data-tab="rutinas"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Rutinas</button>
    <button data-tab="historial"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Historial</button>
    <button data-tab="progreso"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>Progreso</button>
    <button data-tab="metas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8"/></svg>Metas</button>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));
const roundTo = (x, step) => { const s = step > 0 ? step : 0.5; return Math.round(x / s) * s; };
const repTxt = p => p.repMin === p.repMax ? String(p.repMax) : p.repMin + "–" + p.repMax;

const sb = (!SB_URL.startsWith("PEGAR") && window.supabase) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
const Store = {
  user: null, ready: null,
  cacheKey(){ return "bh_cache_" + (this.user ? this.user.id : "anon"); },
  applyRows(rows){
    for (const c in COLS) state[COLS[c]] = [];
    state.config = Object.assign({}, DEF_CONFIG);
    for (const r of rows){
      if (r.coleccion === "config"){ if (r.id === "ajustes") state.config = Object.assign({}, DEF_CONFIG, r.data); }
      else if (COLS[r.coleccion]) state[COLS[r.coleccion]].push(Object.assign({id: r.id}, r.data));
    }
  },
  snapshot(){
    const rows = [];
    for (const c in COLS) for (const x of state[COLS[c]]){ const d = Object.assign({}, x); delete d.id; rows.push({coleccion: c, id: x.id, data: d}); }
    rows.push({coleccion: "config", id: "ajustes", data: state.config});
    return rows;
  },
  cache(){ LS.set(this.cacheKey(), this.snapshot()); },
  init(){ this.ready = this._init(); return this.ready; },
  async _init(){
    if (!sb){ showLogin(SB_URL.startsWith("PEGAR") ? "La app aún no está conectada a su base de datos." : "No se pudo cargar la conexión. Revisa tu internet y recarga la página.", true); return; }
    sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT"){ this.user = null; showLogin(); } });
    const { data } = await sb.auth.getSession();
    if (!data.session){ showLogin(); return; }
    await this.start(data.session.user);
  },
  async start(user){
    this.user = user; hideLogin();
    const cached = LS.get(this.cacheKey(), null);
    if (cached){ this.applyRows(cached); onData(); }
    await this.pull();
    this.loadProfile();
    if (draftHasContent()) saveDraft(false);
  },
  usuario: null,
  async loadProfile(){
    const { data } = await sb.from("perfiles").select("usuario").eq("user_id", this.user.id).maybeSingle();
    this.usuario = data ? data.usuario : null;
    if (state.tab === "historial") onData();
  },
  async setUsuario(u){
    const { error } = await sb.from("perfiles").upsert({user_id: this.user.id, usuario: u});
    if (error) throw error;
    this.usuario = u;
  },
  async pull(){
    if (!this.user) return;
    const { data, error } = await sb.from("docs").select("coleccion,id,data");
    if (error){ setSync("err"); return; }
    this.applyRows(data); this.cache(); setSync("ok"); onData();
  },
  // actualiza la vista al tiro y después guarda en la nube
  local(coll, id, body){
    if (coll === "config") state.config = Object.assign({}, DEF_CONFIG, body);
    else { const k = COLS[coll]; state[k] = state[k].filter(x => x.id !== id); if (body) state[k].push(Object.assign({id}, body)); }
    this.cache(); onData();
  },
  async save(coll, id, obj){
    const body = Object.assign({}, obj); delete body.id;
    await this.ready;
    if (!this.user) throw new Error("sin sesión");
    this.local(coll, id, body);
    const { error } = await sb.from("docs").upsert({user_id: this.user.id, coleccion: coll, id, data: body, updated_at: new Date().toISOString()});
    if (error){ setSync("err"); throw error; }
    setSync("ok");
  },
  async remove(coll, id){
    await this.ready;
    if (!this.user) throw new Error("sin sesión");
    this.local(coll, id, null);
    const { error } = await sb.from("docs").delete().match({coleccion: coll, id});
    if (error){ setSync("err"); throw error; }
    setSync("ok");
  },
  async saveConfig(patch){ await this.save("config", "ajustes", Object.assign({}, state.config, patch)); },
  async importRows(rows){
    const clean = rows.filter(r => r && typeof r.coleccion === "string" && typeof r.id === "string" && r.data && typeof r.data === "object")
      .map(r => ({user_id: this.user.id, coleccion: r.coleccion, id: r.id, data: r.data, updated_at: new Date().toISOString()}));
    if (!clean.length) throw new Error("vacío");
    const { error } = await sb.from("docs").upsert(clean);
    if (error) throw error;
    await this.pull();
    return clean.length;
  },
  async signOut(){ LS.set(this.cacheKey(), null); await sb.auth.signOut(); }

/* ---------- login ---------- */
function loginMsg(txt, isErr){ const m = $("#login-msg"); m.hidden = !txt; m.textContent = txt || ""; m.className = "msg" + (isErr ? " err" : ""); }
function showLogin(txt, isErr){ $("#login").hidden = false; loginMsg(txt, isErr); }
function hideLogin(){ $("#login").hidden = true; loginMsg(""); }
function authError(e){
  const c = (e && (e.code || e.message) || "").toLowerCase();
  if (c.includes("invalid") && c.includes("credential")) return "Email o contraseña incorrectos.";
  if (c.includes("not_confirmed") || c.includes("not confirmed")) return "Primero confirma tu cuenta con el enlace que te llegó al correo.";
  if (c.includes("already") || c.includes("exists")) return "Ese email ya tiene cuenta. Usa Entrar.";
  if (c.includes("password") && (c.includes("6") || c.includes("weak") || c.includes("short"))) return "La contraseña debe tener al menos 6 caracteres.";
  if (c.includes("rate")) return "Demasiados intentos. Espera un minuto y vuelve a probar.";
  return "No se pudo completar. Revisa tu conexión e intenta de nuevo.";
}
const USER_RE = /^[a-z0-9._]{3,20}$/;
let signupMode = false;
function setLoginMode(up){
  signupMode = up; loginMsg("");
  $("#l-id-label").textContent = up ? "Email" : "Email o usuario";
  $("#l-email").setAttribute("autocomplete", up ? "email" : "username");
  $("#l-user-wrap").hidden = !up;
  $("#l-pass").setAttribute("autocomplete", up ? "new-password" : "current-password");
  $("#l-in").textContent = up ? "Crear cuenta" : "Entrar";
  $("#l-mode").textContent = up ? "Ya tengo cuenta" : "Crear cuenta nueva";
}
$("#l-mode").addEventListener("click", () => setLoginMode(!signupMode));
$("#login-form").addEventListener("submit", async e => {
  e.preventDefault(); if (!sb) return;
  const btn = $("#l-in");
  const id = $("#l-email").value.trim(), password = $("#l-pass").value;
  if (signupMode){
    const usuario = $("#l-user").value.trim().toLowerCase();
    if (!id.includes("@") || password.length < 6){ loginMsg("Escribe tu email y una contraseña de al menos 6 caracteres.", true); return; }
    if (usuario && !USER_RE.test(usuario)){ loginMsg("El usuario debe tener de 3 a 20 caracteres: letras minúsculas, números, punto o guion bajo.", true); return; }
    btn.disabled = true;
    if (usuario){
      const { data: libre } = await sb.rpc("usuario_disponible", {p_usuario: usuario});
      if (libre === false){ btn.disabled = false; loginMsg("Ese nombre de usuario ya está ocupado. Prueba con otro.", true); return; }
    }
    const { data, error } = await sb.auth.signUp({email: id, password, options: {emailRedirectTo: location.origin + location.pathname, data: usuario ? {usuario} : {}}});
    btn.disabled = false;
    if (error){ loginMsg(authError(error), true); return; }
    if (data.session) await Store.start(data.user);
    else { setLoginMode(false); loginMsg("Te enviamos un correo para confirmar la cuenta. Ábrelo, toca el enlace y después entra aquí con tu email o usuario."); }
    return;
  }
  if (!id || !password){ loginMsg("Escribe tu email o usuario y tu contraseña.", true); return; }
  btn.disabled = true; loginMsg("Entrando…");
  let email = id;
  if (!id.includes("@")){
    const { data: found, error: e1 } = await sb.rpc("email_de_usuario", {p_usuario: id.toLowerCase()});
    if (e1 || !found){ btn.disabled = false; loginMsg(e1 ? "No se pudo buscar el usuario. Revisa tu conexión." : "No existe una cuenta con ese usuario. Prueba con tu email.", true); return; }
    email = found;
  }
  const { data, error } = await sb.auth.signInWithPassword({email, password});
  btn.disabled = false;
  if (error){ loginMsg(authError(error), true); return; }
  await Store.start(data.user);
});

/* ---------- consultas ---------- */
const sorted = () => state.sessions.slice().sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
const attended = () => sorted().filter(s => s.asistio !== false);
const activeRoutine = () => state.routines.find(r => r.id === state.config.rutinaActiva) || null;
function knownNames(){
  const m = new Map();
  for (const c of CATALOG) m.set(key(c.nombre), c.nombre);
  for (const r of state.routines) for (const d of (r.dias || [])) for (const e of (d.ejercicios || [])) m.set(key(e.nombre), e.nombre);
  for (const s of sorted()) for (const e of (s.ejercicios || [])) if (e.nombre && e.nombre.trim()) m.set(key(e.nombre), e.nombre.trim());
  return m;
}
function loggedNames(){
  const m = new Map();
  for (const s of sorted()) for (const e of (s.ejercicios || [])) if (e.nombre && e.nombre.trim() && (e.series || []).length) m.set(key(e.nombre), e.nombre.trim());
  return m;
}
function historyFor(name, excludeId){
  const k = key(name), out = [];
  for (const s of attended()){
    if (s.id === excludeId) continue;
    for (const e of (s.ejercicios || [])){
      if (key(e.nombre) !== k) continue;
      const ser = (e.series || []).filter(x => x.peso != null && x.reps != null && x.reps > 0);
      if (!ser.length) continue;
      const max = Math.max(...ser.map(x => x.peso));
      const best = Math.max(...ser.map(x => e1rm(x.peso, x.reps)));
      const vol = ser.reduce((a, x) => a + x.peso * x.reps, 0);
      out.push({fecha: s.fecha, max, e1rm: best, vol, series: ser, unidad: e.unidad || "kg", maquina: e.maquina || ""});
    }
  }
  return out;
}
// último registro de un ejercicio (para heredar unidad y máquina)
function lastMeta(name, excludeId){ const h = historyFor(name, excludeId); return h.length ? h[h.length - 1] : null; }
// volumen en kg reales: libras se convierten, placas no cuentan (no son kilos)
function sessionVolume(s){ let v = 0; for (const e of (s.ejercicios || [])) for (const x of (e.series || [])) if (x.peso != null && x.reps != null) v += toKg(x.peso, e.unidad) * x.reps; return v; }
function weeklyCounts(){ const m = {}; for (const s of attended()){ const w = weekStart(s.fecha); m[w] = (m[w] || 0) + 1; } return m; }
function weekStreak(){
  const m = weeklyCounts(), min = state.config.minSemana || 3;
  let w = weekStart(today()), n = 0;
  if ((m[w] || 0) < min) w = addDays(w, -7); // la semana en curso aún puede cumplirse
  while ((m[w] || 0) >= min){ n++; w = addDays(w, -7); }
  return n;
}

/* ---------- progresión (doble progresión) ---------- */
// plan: {series, repMin, repMax, peso, inc}
function suggest(name, plan, excludeId, unidad){
  // solo se compara contra registros en la misma unidad
  const u = unidad || (plan && plan.unidad) || ((lastMeta(name, excludeId) || {}).unidad) || "kg";
  const h = historyFor(name, excludeId).filter(x => x.unidad === u);
  const inc = plan && plan.inc != null ? plan.inc : (u !== "kg" ? incFor(u) : ((CATMAP.get(key(name)) || {}).inc ?? 2.5));
  if (!plan) plan = {series: 3, repMin: 8, repMax: 12, peso: null, inc};
  const W_ = n => fmtW(n, u);
  const step = u === "placa" ? (inc === 1 ? "1 placa" : kg(inc) + " placas") : kg(inc) + " " + u;
  if (!h.length){
    if (plan.peso) return {kind: "start", peso: plan.peso, html: `Primera vez registrada: parte con <b>${W_(plan.peso)}</b> y apunta a ${plan.series}×${repTxt(plan)}.`};
    return {kind: "start", peso: null, html: `Primera vez: elige un peso con el que llegues a <b>${repTxt(plan)} reps</b> dejando 1–2 en reserva. Ese será tu punto de partida.`};
  }
  const last = h[h.length - 1], W = last.max;
  const work = last.series.filter(x => x.peso >= W);
  const repsTxt = work.map(x => x.reps).join("·");
  const allTop = work.length >= plan.series && work.every(x => x.reps >= plan.repMax);
  const allEasy = work.length > 0 && work.every(x => x.esfuerzo === "facil");
  const fails = work.filter(x => x.esfuerzo === "fallo").length;
  const failed = s => { const w = s.series.filter(x => x.peso >= s.max); return w.some(x => x.reps < plan.repMin); };
  const gap = daysBetween(last.fecha, today());
  if (gap > 21) return {kind: "down", peso: roundTo(W * 0.9, inc), html: `Hace ${gap} días que no lo haces. Vuelve con <b>${W_(roundTo(W * 0.9, inc))}</b> (≈90%) y retoma la subida desde ahí.`};
  if (allTop){
    if (!inc) return {kind: "up", peso: W, html: `Completaste ${work.length}×${plan.repMax}. Suma <b>1–2 reps</b> por serie o agrega lastre.`};
    if (allEasy){ const n2 = W + 2 * inc; return {kind: "up", peso: n2, html: `Hiciste ${work.length}×${plan.repMax} con ${W_(W)} y todas te salieron fáciles. <b>Sube a ${W_(n2)}</b> (doble salto).`}; }
    if (fails >= Math.ceil(work.length / 2)) return {kind: "keep", peso: W, html: `Llegaste a ${plan.repMax} reps con ${W_(W)}, pero al fallo en ${fails} de ${work.length} series. <b>Repite ${W_(W)}</b> una vez más; si sale sin llegar al fallo, sube ${step}.`};
    return {kind: "up", peso: W + inc, html: `Hiciste ${work.length}×${plan.repMax} con ${W_(W)} (${repsTxt}). <b>Sube a ${W_(W + inc)}.</b>`};
  }
  if (failed(last)){
    const prev = h[h.length - 2];
    if (prev && prev.max === W && failed(prev)){
      const d = roundTo(W * 0.9, inc);
      return {kind: "down", peso: d, html: `Dos sesiones seguidas sin llegar a ${plan.repMin} reps con ${W_(W)}. <b>Baja a ${W_(d)}</b> y vuelve a subir desde ahí.`};
    }
    return {kind: "keep", peso: W, html: `Última vez ${repsTxt} con ${W_(W)}. <b>Repite ${W_(W)}</b>; si otra vez no llegas a ${plan.repMin}, toca bajar un poco.`};
  }
  if (allEasy) return {kind: "keep", peso: W, html: `Última vez ${repsTxt} con ${W_(W)} y te salió fácil. <b>Mantén ${W_(W)}</b> y apura hasta ${plan.repMax} reps: si llegas, subes la próxima.`};
  return {kind: "keep", peso: W, html: `Última vez ${repsTxt} con ${W_(W)}. <b>Mantén ${W_(W)}</b> y busca ${plan.repMax} reps en las ${plan.series} series.`};
}
const sugIcon = k => k === "up" ? "▲" : k === "down" ? "▼" : "●";

/* ---------- borrador (hoy) ---------- */
function cleanDraft(){
  return {
    fecha: draft.fecha, tipo_dia: draft.tipo_dia, asistio: draft.asistio, notas: (draft.notas || "").trim(),
    rutinaId: draft.rutinaId || null, diaIdx: draft.diaIdx ?? null,
    ejercicios: draft.ejercicios.filter(e => e.nombre && e.nombre.trim()).map(e => {
      const o = { nombre: e.nombre.trim(), unidad: e.unidad || "kg", maquina: (e.maquina || "").trim(),
        series: e.series.map((x, i) => { const s = {numero_serie: i + 1, peso: num(x.peso) ?? 0, reps: num(x.reps)}; if (x.esfuerzo) s.esfuerzo = x.esfuerzo; return s; }).filter(x => x.reps != null) };
      if (e.plan) o.objetivo = {series: e.plan.series, repMin: e.plan.repMin, repMax: e.plan.repMax};
      return o;
    }).filter(e => e.series.length || e.objetivo),
    actualizado: new Date().toISOString()
  };
}
const draftHasContent = () => draft.notas.trim() || draft.asistio === false || draft.ejercicios.some(e => e.nombre && e.nombre.trim() && e.series.some(x => num(x.reps) != null));
let saveT;
function touchDraft(){
  LS.set("bh_draft", draft);
  if (!draftHasContent()) return;
  draftStatus = "pending"; paintSaveState();
  clearTimeout(saveT); saveT = setTimeout(saveDraft, 1500);
}
async function saveDraft(manual){
  clearTimeout(saveT);
  if (!Store.user) return; // se sube al iniciar sesión
  if (!draftHasContent()){ if (manual) toast("Anota al menos una serie con repeticiones"); return; }
  try { await Store.save("sesiones", draft.id, cleanDraft()); draftStatus = "saved"; if (manual) toast("Sesión guardada"); }
  catch(e){
    // sin señal en el gym: queda guardado en el teléfono y se reintenta solo
    draftStatus = "error"; if (manual) toast("Sin conexión. Quedó guardado en el teléfono y se sube solo al volver la señal.");
    clearTimeout(saveT); saveT = setTimeout(saveDraft, 20000);
  }
  paintSaveState();
}
function paintSaveState(){
  const el = $("#save-st"); if (!el) return;
  el.textContent = draftStatus === "pending" ? "Guardando…" : draftStatus === "saved" ? "Guardado ✓" : draftStatus === "error" ? "Sin señal: se reintenta solo" : "Se guarda solo mientras anotas";
}
function planFor(name){
  const r = state.routines.find(x => x.id === draft.rutinaId); if (!r || draft.diaIdx == null) return null;
  const d = (r.dias || [])[draft.diaIdx]; if (!d) return null;
  return (d.ejercicios || []).find(e => key(e.nombre) === key(name)) || null;
}
function loadIntoDraft(s){
  draft = { id: s.id, fecha: s.fecha, tipo_dia: s.tipo_dia || "Libre", asistio: s.asistio !== false, notas: s.notas || "",
    rutinaId: s.rutinaId || null, diaIdx: s.diaIdx ?? null,
    ejercicios: (s.ejercicios || []).map(e => ({ nombre: e.nombre, unidad: e.unidad || "kg", maquina: e.maquina || "",
      plan: e.objetivo ? Object.assign({inc: (CATMAP.get(key(e.nombre)) || {}).inc ?? 2.5}, e.objetivo) : null,
      series: (e.series || []).map(x => ({peso: x.peso ?? "", reps: x.reps ?? "", esfuerzo: x.esfuerzo || null})) })) };
  // recuperar el plan completo de la rutina si existe
  for (const e of draft.ejercicios){ const p = planFor(e.nombre); if (p) e.plan = clone(p); }
  draftStatus = "saved"; LS.set("bh_draft", draft);
}
function nextDayIdx(r){
  const n = (r.dias || []).length; if (!n) return null;
  const last = attended().reverse().find(s => s.rutinaId === r.id && s.diaIdx != null && s.id !== draft.id);
  return last ? (last.diaIdx + 1) % n : 0;
}
function startDay(r, idx){
  const d = r.dias[idx];
  draft.rutinaId = r.id; draft.diaIdx = idx; draft.tipo_dia = d.nombre;
  draft.ejercicios = (d.ejercicios || []).map(p => newDraftEx(p.nombre, p));
  touchDraft(); renderAll();
}
// ejercicio nuevo para la sesión: hereda unidad y máquina de la rutina o del último registro
function newDraftEx(name, p){
  const lm = lastMeta(name, draft.id);
  const unidad = (p && p.unidad) || (lm && lm.unidad) || "kg";
  const maquina = (p && p.maquina) || (lm && lm.maquina) || "";
  const sg = suggest(name, p, draft.id, unidad);
  return {nombre: name, unidad, maquina, plan: p ? clone(p) : null,
    series: Array.from({length: p ? (p.series || 3) : 3}, () => ({peso: sg.peso ?? "", reps: "", esfuerzo: null}))};
}
function prevMax(name, unidad){ const h = historyFor(name, draft.id).filter(x => x.unidad === (unidad || "kg")); return h.length ? Math.max(...h.map(x => x.max)) : null; }

    ${u === "placa" ? `<p class="hint" style="margin:0">Anota el número de placa que marca la máquina. Se compara solo contra sí mismo y no suma al volumen en kg.</p>` : ""}

function exFoot(e, pm){
  const u = e.unidad || "kg";
  const ser = e.series.map(x => ({p: num(x.peso), r: num(x.reps)})).filter(x => x.p != null && x.r);
  if (!ser.length) return `<span>${pm != null ? "Tu máximo: <b class='num'>" + fmtW(pm, u) + "</b>" : ""}</span>`;
  const top = Math.max(...ser.map(x => x.p));
  const pr = pm != null && top > pm ? `<span class="badge">Récord personal · ${fmtW(top, u)}</span>` : "";
  if (u === "placa") return `${pr}<span>Mejor serie <b class="num">${fmtW(top, u)}</b></span>`;
  const vol = ser.reduce((a, x) => a + x.p * x.r, 0), best = Math.max(...ser.map(x => e1rm(x.p, x.r)));
  return `${pr}<span>Volumen <b class="num">${fmtW(vol, u)}</b></span><span>1RM estimado <b class="num">${fmtW(best, u)}</b></span>`;
}

const picker = {open: false, q: "", grupo: null, onPick: null};

function closePicker(){ picker.open = false; $("#picker").hidden = true; document.body.style.overflow = ""; }
function pickerItems(){
  const items = CATALOG.slice(), seen = new Set(items.map(c => key(c.nombre)));
  for (const [k, n] of knownNames()) if (!seen.has(k)){ seen.add(k); items.push({nombre: n, grupo: "Mis ejercicios", equipo: "", inc: 2.5}); }
  const q = key(picker.q);
  return items.filter(c => (!picker.grupo || c.grupo === picker.grupo) && (!q || key(c.nombre).includes(q) || key(c.grupo).includes(q) || key(c.equipo).includes(q)));
}
function renderPicker(){

/* ---------- progreso ---------- */
function niceStep(range, target){
  const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const k of [1, 2, 2.5, 5, 10]) if (raw <= k * p) return k * p;
  return 10 * p;
}
function lineChart(pts, unit, single){
  const W = 640, H = 240, L = 46, R = 14, T = 14, B = 30;
  const xs = pts.map(p => parseD(p.fecha).getTime());
  const ys = pts.flatMap(p => single ? [p.max] : [p.max, p.e1rm]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 5){ lo -= 2.5; hi += 2.5; }
  const step = niceStep(hi - lo, 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x0 = Math.min(...xs), x1 = Math.max(...xs), xr = x1 - x0 || 1;
  const X = t => L + (t - x0) / xr * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${kg(v)}</text>`;
  const nt = Math.min(pts.length, 5);
  for (let i = 0; i < nt; i++){ const k = Math.round(i * (pts.length - 1) / Math.max(nt - 1, 1)); const p = pts[k]; g += `<text x="${X(xs[k])}" y="${H - 8}" text-anchor="${k === 0 ? "start" : k === pts.length - 1 ? "end" : "middle"}">${fmtShort(p.fecha)}</text>`; }
  const path = f => pts.map((p, i) => (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(p[f]).toFixed(1)).join(" ");
  const area = path("max") + ` L${X(xs[xs.length-1]).toFixed(1)} ${H - B} L${X(xs[0]).toFixed(1)} ${H - B} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso máximo por sesión">
    ${g}
    <path d="${area}" fill="var(--accent)" fill-opacity=".10"/>
    ${single ? "" : `<path d="${path("e1rm")}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 4"/>`}
    <path d="${path("max")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${X(xs[i])}" cy="${Y(p.max)}" r="${i === pts.length - 1 ? 5 : 3}" fill="var(--accent)"/>`).join("")}
    <text x="${X(xs[xs.length-1]) - 8}" y="${Y(last.max) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:500">${fmtW(last.max, unit)}</text>
  </svg>`;
}
function barChart(weeks, opts){
  const W = 640, H = 200, L = 46, R = 10, T = 14, B = 30;
  const hi0 = Math.max(...weeks.map(w => w.v), opts && opts.line || 0, 1), step = opts && opts.int ? Math.max(1, Math.ceil(hi0 / 4)) : niceStep(hi0, 3), hi = Math.ceil(hi0 / step) * step;
  const bw = (W - L - R) / weeks.length, Y = v => T + (1 - v / hi) * (H - T - B);
  let g = "";
  for (let v = 0; v <= hi + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v >= 1000 ? kg(v / 1000) + "t" : kg(v)}</text>`;
  weeks.forEach((w, i) => {
    const x = L + i * bw + bw * .18, h = Y(0) - Y(w.v), cur = i === weeks.length - 1;
    const col = opts && opts.min != null ? (w.v >= opts.min ? "var(--accent)" : "var(--muted)") : "var(--accent)";
    g += `<rect x="${x}" y="${Y(w.v)}" width="${bw * .64}" height="${Math.max(h, 0)}" rx="3" fill="${col}" fill-opacity="${cur ? 1 : .6}"/>`;
    if (i % 2 === (weeks.length - 1) % 2) g += `<text x="${x + bw * .32}" y="${H - 8}" text-anchor="middle">${fmtShort(w.w)}</text>`;
  });
  if (opts && opts.line) g += `<line x1="${L}" x2="${W - R}" y1="${Y(opts.line)}" y2="${Y(opts.line)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts && opts.label || "Volumen semanal"}">${g}</svg>`;
}
function tips(){
  const out = [], t = today();
  for (const [k, name] of loggedNames()){
    const h = historyFor(name); if (h.length < 3) continue;
    if (daysBetween(h[0].fecha, t) < 21) continue;
    const cut = addDays(t, -21);
    const before = h.filter(x => x.fecha < cut), recent = h.filter(x => x.fecha >= cut);
    if (!before.length || recent.length < 2) continue;
    const bm = Math.max(...before.map(x => x.max)), rm = Math.max(...recent.map(x => x.max));
    if (rm <= bm) out.push({warn: true, html: `Llevas 3 semanas sin subir peso en <b>${esc(name)}</b> (tope ${fmtW(bm, h[h.length - 1].unidad)}). Prueba sumar 1 rep por serie antes de subir, alargar un poco el descanso entre series o dormir mejor esa semana.`});
    else out.push({warn: false, html: `<b>${esc(name)}</b> va subiendo: de ${kg(bm)} a ${kg(rm)} kg en las últimas 3 semanas.`});
  }
  const last = attended().pop();
  if (last){ const d = daysBetween(last.fecha, t); if (d >= 4) out.unshift({warn: true, html: `Tu última sesión fue hace <b>${d} días</b>. Hoy es buen día para volver.`}); }
  return out.slice(0, 5);
}
function renderProgreso(){

  const pr = h.length ? h.reduce((a, x) => x.max > a.max ? x : a, h[0]) : null;

      ${(d.ejercicios || []).map(e => { const sg = suggest(e.nombre, e); return `<tr><td>${esc(e.nombre)}<div class="hint">${e.series}×${repTxt(e)}</div></td><td class="r" style="white-space:nowrap"><span class="badge ${sg.kind === "up" ? "green" : sg.kind === "down" ? "warn" : "grey"}">${sugIcon(sg.kind)} ${sg.peso != null ? fmtW(sg.peso, e.unidad) : "por definir"}</span></td></tr>`; }).join("")}
    </table></div>`).join("")}
    <p class="hint" style="margin:0">▲ toca subir · ● mantener y sumar reps · ▼ bajar un poco</p>

  ${tp.length ? `<h2>Consejos</h2><div class="stack">${tp.map(x => `<div class="tip ${x.warn ? "" : "good"}"><span>${x.warn ? "▲" : "✓"}</span><span>${x.html}</span></div>`).join("")}</div>` : ""}
  <h2>Peso por ejercicio</h2>
  ${names.length ? `<div class="panel stack">

/* ---------- cuerpo: peso y medidas ---------- */
const MEDIDAS = [["peso","Peso","kg"],["cintura","Cintura","cm"],["pecho","Pecho","cm"],["brazo","Brazo","cm"],["muslo","Muslo","cm"],["cadera","Cadera","cm"]];

  const first = {}, lastV = {};
  for (const x of list) for (const [k] of MEDIDAS) if (x[k] != null){ if (first[k] == null) first[k] = {v: x[k], f: x.fecha}; lastV[k] = {v: x[k], f: x.fecha}; }

    ${rowsM ? `<table class="tbl"><tr><th>Medida</th><th class="r">Inicio</th><th class="r">Última</th><th class="r">Cambio</th></tr>${rowsM}</table>` : ""}

async function saveBody(){

/* ---------- metas ---------- */
function goalProgress(g){
  const t = today();
  if (g.tipo === "peso"){
    const u = g.unidad || "kg";
    const h = historyFor(g.ejercicio).filter(x => x.unidad === u); const cur = h.length ? Math.max(...h.map(x => x.max)) : 0;
    const start = g.inicio ?? 0, span = g.objetivo - start;
    const pct = span > 0 ? (cur - start) / span : (cur >= g.objetivo ? 1 : 0);
    return {pct, done: cur >= g.objetivo, txt: `<span class="num">${fmtW(cur, u)}</span> / <span class="num">${fmtW(g.objetivo, u)}</span>`, sub: `Empezaste en ${fmtW(start, u)}`};
  }
  if (g.tipo === "mes"){
    const cur = attended().filter(s => s.fecha.startsWith(t.slice(0, 7))).length;
    return {pct: cur / g.objetivo, done: cur >= g.objetivo, txt: `<span class="num">${cur}</span> / <span class="num">${g.objetivo}</span> días en ${MESL[parseD(t).getMonth()]}`, sub: ""};
  }
  if (g.tipo === "frecuencia"){
    const cur = weeklyCounts()[weekStart(t)] || 0;
    return {pct: cur / g.objetivo, done: cur >= g.objetivo, txt: `<span class="num">${cur}</span> / <span class="num">${g.objetivo}</span> días esta semana`, sub: ""};
  }
  return {pct: g.completada ? 1 : 0, done: !!g.completada, txt: g.completada ? "Lograda" : "En curso", sub: ""};
}
function goalTitle(g){
  if (g.tipo === "peso") return `${esc(g.ejercicio)} a ${fmtW(g.objetivo, g.unidad)}`;
  if (g.tipo === "frecuencia") return `Ir ${g.objetivo} días por semana`;
  if (g.tipo === "mes") return `${g.objetivo} días de gym este mes`;
  return esc(g.titulo);
}
function goalHTML(g){
  const p = goalProgress(g), pct = Math.max(0, Math.min(1, p.pct));
  let dl = "";
  if (g.fecha_limite){ const d = daysBetween(today(), g.fecha_limite); dl = d > 0 ? `Quedan ${d} días (${fmtShort(g.fecha_limite)})` : d === 0 ? "Vence hoy" : `Venció el ${fmtShort(g.fecha_limite)}`; }
  return `<div class="goal ${p.done ? "done" : ""}">
    <div class="top"><div><div class="title">${goalTitle(g)}</div><div class="hint">${[p.sub, dl].filter(Boolean).join(" · ")}</div></div>
    ${p.done ? `<span class="badge green">Lograda</span>` : `<span class="badge grey">${Math.round(pct * 100)}%</span>`}</div>
    <div class="bar"><span style="width:${(pct * 100).toFixed(1)}%"></span></div>
    <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
      <span style="flex:0 1 auto">${p.txt}</span>
      <span class="row tight" style="gap:6px">
        ${g.tipo === "libre" ? `<button class="small" data-act="goal-toggle" data-id="${esc(g.id)}">${g.completada ? "Reabrir" : "Marcar lograda"}</button>` : ""}
        <button class="small danger" data-act="goal-del" data-id="${esc(g.id)}">Eliminar</button>
      </span>
    </div>
  </div>`;
}
let goalForm = {tipo: "peso"};
function weeklyGoalHTML(){
  const meta = state.config.metaSemana || 4, min = state.config.minSemana || 3, m = weeklyCounts(), wk = weekStart(today());
  const weeks = []; for (let i = 11; i >= 0; i--){ const w = addDays(wk, -7 * i); weeks.push({w, v: m[w] || 0}); }
  const past = weeks.slice(0, -1).filter(w => w.w >= (state.sessions.length ? weekStart(sorted()[0].fecha) : wk));
  const ok = past.filter(w => w.v >= min).length, full = past.filter(w => w.v >= meta).length;
  return `<div class="goal">
    <div class="top"><div><div class="title">Ir ${meta} días por semana</div><div class="hint">Mínimo aceptable ${min} · se cambia en Rutinas</div></div>
      <span class="badge ${weekStreak() ? "green" : "grey"}">Racha ${weekStreak()} sem.</span></div>
    ${barChart(weeks, {int: true, line: meta, min, label: "Días por semana"})}
    <p class="hint" style="margin:0">${past.length ? `De las semanas registradas: ${ok} cumplieron el mínimo y ${full} llegaron a ${meta}.` : "Las barras se llenan a medida que registras sesiones. La línea verde marca tu meta."}</p>
  </div>`;
}
function renderMetas(){
  const gs = state.goals.slice().sort((a, b) => (a.creada || "") < (b.creada || "") ? 1 : -1);
  const active = gs.filter(g => !goalProgress(g).done), done = gs.filter(g => goalProgress(g).done);
  const tp = goalForm.tipo;
  return `
  <h2>Constancia</h2>
  ${weeklyGoalHTML()}
  <h2>Nueva meta</h2>
  <div class="panel stack">
    <div class="seg" role="group" aria-label="Tipo de meta">
      ${[["peso","Peso en ejercicio"],["mes","Días del mes"],["libre","Libre"]].map(([v, l]) => `<button data-act="gtipo" data-v="${v}" aria-pressed="${tp === v}">${l}</button>`).join("")}
    </div>
    ${tp === "peso" ? `<div class="row">
        <label class="f"><span class="label">Ejercicio</span><input id="g-ex" list="ex-list" placeholder="Press banca" autocomplete="off"></label>
        <label class="f"><span class="label">Peso objetivo (kg)</span><input id="g-obj" inputmode="decimal" placeholder="60"></label>
      </div>` : tp === "mes" ? `<label class="f"><span class="label">Días de gym este mes</span><input id="g-obj" inputmode="numeric" placeholder="16"></label>`
      : `<label class="f"><span class="label">Meta</span><input id="g-tit" placeholder="Ej: hacer 10 dominadas seguidas"></label>`}
    <label class="f"><span class="label">Fecha límite (opcional)</span><input type="date" id="g-dl"></label>
    <button class="primary" data-act="goal-add">Crear meta</button>
  </div>
  <h2>En curso</h2>
  ${active.length ? `<div class="stack">${active.map(goalHTML).join("")}</div>` : `<div class="empty">No tienes metas en curso. Por ejemplo: press banca a 60 kg antes de fin de año.</div>`}
  ${done.length ? `<h2>Logradas</h2><div class="stack">${done.map(goalHTML).join("")}</div>` : ""}`;
}

/* ---------- render ---------- */
function paintDatalist(){ $("#ex-list").innerHTML = [...knownNames().values()].map(n => `<option value="${esc(n)}">`).join(""); }
function renderAll(){
  const v = $("#view");
  v.innerHTML = state.tab === "historial" ? renderHistorial() : state.tab === "progreso" ? renderProgreso() : state.tab === "metas" ? renderMetas() : state.tab === "rutinas" ? renderRutinas() : renderRegistrar();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false"));
  paintDatalist(); paintSaveState();
}
function onData(){
  paintDatalist();
  if (state.tab === "rutinas" && state.editing) return; // no pisar la edición en curso
  const ae = document.activeElement;
  if (ae && ae.closest && ae.closest("#view") && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  renderAll();
}
function rerenderEx(i){
  const el = document.querySelector(`[data-ex="${i}"]`); if (!el) return renderAll();
  const focusId = document.activeElement && document.activeElement.id;
  const tmp = document.createElement("div"); tmp.innerHTML = exHTML(draft.ejercicios[i], i); el.replaceWith(tmp.firstElementChild);
  if (focusId){ const f = document.getElementById(focusId); if (f && f !== document.activeElement) f.focus(); }
}
function goTab(t){ state.tab = t; LS.set("bh_tab", t); renderAll(); window.scrollTo(0, 0); }

/* ---------- eventos ---------- */
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return; goTab(b.dataset.tab);
});
const view = $("#view");
view.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f){
    const i = +t.dataset.i, f = t.dataset.f;
    if (f === "nombre") draft.ejercicios[i].nombre = t.value;
    else if (f === "maquina") draft.ejercicios[i].maquina = t.value;
    else if (f === "unidad") return; // se maneja en change
    else {
      draft.ejercicios[i].series[+t.dataset.j][f] = t.value;
      const pm = draft.ejercicios[i].nombre ? prevMax(draft.ejercicios[i].nombre, draft.ejercicios[i].unidad) : null;
      const f = $("#exf-" + i); if (f) f.innerHTML = exFoot(draft.ejercicios[i], pm);
    }
    touchDraft();
  } else if (t.id === "f-notas"){ draft.notas = t.value; touchDraft(); }
  else if (t.dataset.rf && state.editing){
    const d = state.editing.dias[+t.dataset.d];
    if (t.dataset.rf === "dia") d.nombre = t.value;
    else if (t.dataset.rf !== "unidad"){ const ex = d.ejercicios[+t.dataset.e]; ex[t.dataset.rf] = (t.dataset.rf === "nota" || t.dataset.rf === "maquina") ? t.value : num(t.value); }
  } else if (t.id === "r-nombre" && state.editing){ state.editing.nombre = t.value; }
});
view.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "imp-file"){ if (t.files && t.files[0]) await importBackup(t.files[0]); t.value = ""; return; }
  if (t.id === "f-fecha"){ draft.fecha = t.value || today(); touchDraft(); }
  else if (t.id === "f-ex"){ state.exercise = t.value; LS.set("bh_ex", t.value); renderAll(); }
  else if (t.dataset.f === "nombre"){
    const i = +t.dataset.i, ex = draft.ejercicios[i];
    const p = planFor(t.value); if (p && !ex.plan) ex.plan = clone(p);
    // si aún no anotó nada, hereda unidad y máquina de la última vez
    if (!ex.series.some(s => num(s.reps) != null)){ const lm = lastMeta(t.value, draft.id); if (lm){ ex.unidad = lm.unidad; if (!ex.maquina) ex.maquina = lm.maquina; } }
    touchDraft(); setTimeout(() => rerenderEx(i), 0);
  }
  else if (t.dataset.f === "unidad"){ const i = +t.dataset.i; draft.ejercicios[i].unidad = t.value; touchDraft(); rerenderEx(i); }
  else if (t.dataset.rf === "unidad" && state.editing){
    const ex = state.editing.dias[+t.dataset.d].ejercicios[+t.dataset.e];
    ex.unidad = t.value; ex.inc = incFor(t.value) === 2.5 ? ((CATMAP.get(key(ex.nombre)) || {}).inc ?? 2.5) : incFor(t.value); renderAll();
  }
  else if (t.id === "c-meta" || t.id === "c-min"){
    const meta = Math.max(1, Math.min(7, Math.round(num($("#c-meta").value) || 4)));
    const min = Math.max(1, Math.min(meta, Math.round(num($("#c-min").value) || 3)));
    try { await Store.saveConfig({metaSemana: meta, minSemana: min}); toast(`Meta ${meta} días, mínimo ${min}`); } catch(err){ toast("No se pudo guardar. Intenta de nuevo."); }
  }
});
view.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.f === "reps"){
    e.preventDefault(); const i = +e.target.dataset.i, j = +e.target.dataset.j, ex = draft.ejercicios[i];
    if (j < ex.series.length - 1){ const n = $(`#r-${i}-${j + 1}`); if (n) n.focus(); } else addSet(i);
  }
});
function addSet(i){
  const ex = draft.ejercicios[i], last = ex.series[ex.series.length - 1];
  ex.series.push({peso: last ? last.peso : "", reps: "", esfuerzo: null});
  touchDraft(); rerenderEx(i);
  const j = ex.series.length - 1; const inp = $(`#r-${i}-${j}`); if (inp) inp.focus();
}
function addExerciseToDraft(name){
  draft.ejercicios.push(newDraftEx(name, planFor(name)));
  touchDraft(); renderAll();
  const el = document.querySelector(`[data-ex="${draft.ejercicios.length - 1}"]`); if (el) el.scrollIntoView({block: "center"});
}
const armed = new Map();
function arm(btn, label, fn){
  const k = btn.dataset.act + (btn.dataset.id || btn.dataset.d || btn.dataset.v || "");
  if (armed.get(k)){ armed.delete(k); fn(); return; }
  armed.set(k, true); btn.classList.add("armed"); const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { armed.delete(k); if (btn.isConnected){ btn.classList.remove("armed"); btn.textContent = old; } }, 3500);
}
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };

view.addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  /* hoy */
  if (a === "eff"){
    const s = draft.ejercicios[i].series[+b.dataset.j];
    s.esfuerzo = EFF[(EFF.indexOf(s.esfuerzo || null) + 1) % EFF.length];
    b.className = "eff " + (s.esfuerzo || ""); b.textContent = s.esfuerzo ? EFFL[s.esfuerzo] : "¿Cómo?";
    touchDraft();
  }
  else if (a === "add-ex"){
    draft.ejercicios.push({nombre: "", unidad: "kg", maquina: "", plan: null, series: [{peso: "", reps: "", esfuerzo: null}]}); touchDraft(); renderAll();
    const n = $("#n-" + (draft.ejercicios.length - 1)); if (n) n.focus();
  }
  else if (a === "pick-ex"){ openPicker(name => addExerciseToDraft(name)); }
  else if (a === "del-ex"){ draft.ejercicios.splice(i, 1); touchDraft(); renderAll(); }
  else if (a === "add-set"){ addSet(i); }
  else if (a === "del-set"){ draft.ejercicios[i].series.splice(+b.dataset.j, 1); touchDraft(); rerenderEx(i); }
  else if (a === "asistio"){ draft.asistio = b.dataset.v === "1"; touchDraft(); renderAll(); }
  else if (a === "pick-day"){
    const r = activeRoutine(); const v = b.dataset.v;
    const hasSets = draft.ejercicios.some(x => x.series.some(s => num(s.reps) != null));
    const doIt = () => {
      if (v === "libre"){ draft.rutinaId = null; draft.diaIdx = null; draft.tipo_dia = "Libre"; if (!draft.ejercicios.length) draft.ejercicios.push({nombre: "", unidad: "kg", maquina: "", plan: null, series: [{peso: "", reps: "", esfuerzo: null}]}); touchDraft(); renderAll(); }
      else startDay(r, +v);
    };
    if (hasSets) arm(b, "¿Cambiar? Toca otra vez", doIt); else doIt();
  }
  else if (a === "save"){ await saveDraft(true); }
  else if (a === "new"){
    if (draftHasContent()) await saveDraft(false);
    draft = newDraft(); draftStatus = "idle"; LS.set("bh_draft", draft); renderAll(); window.scrollTo(0, 0);
  }
  /* historial */
  else if (a === "cal"){
    const [y, m] = state.calMonth.split("-").map(Number); const d = new Date(y, m - 1 + (+b.dataset.v), 1);
    state.calMonth = d.getFullYear() + "-" + pad(d.getMonth() + 1); renderAll();
  }
  else if (a === "day" || a === "edit"){
    const s = a === "day" ? state.sessions.find(x => x.fecha === b.dataset.d) : state.sessions.find(x => x.id === b.dataset.id);
    if (draftHasContent() && draftStatus !== "saved") await saveDraft(false);
    if (s) loadIntoDraft(s); else { draft = newDraft(b.dataset.d); draftStatus = "idle"; LS.set("bh_draft", draft); }
    goTab("registrar");
  }
  else if (a === "del"){
    arm(b, "¿Eliminar? Toca otra vez", async () => {
      try { await Store.remove("sesiones", b.dataset.id); if (draft.id === b.dataset.id){ draft = newDraft(); LS.set("bh_draft", draft); } toast("Sesión eliminada"); }
      catch(err){ toast("No se pudo eliminar. Intenta de nuevo."); }
    });
  }
  else if (a === "csv"){ exportCSV(); }
  else if (a === "backup"){ exportBackup(); }
  else if (a === "set-user"){
    const u = $("#acc-user").value.trim().toLowerCase();
    if (!USER_RE.test(u)){ toast("Usa de 3 a 20 caracteres: letras minúsculas, números, punto o guion bajo."); return; }
    try { await Store.setUsuario(u); toast("Listo: ya puedes entrar con “" + u + "”"); renderAll(); }
    catch(err){ toast(err && err.code === "23505" ? "Ese usuario ya está ocupado. Prueba con otro." : "No se pudo guardar. ¿Corriste usuarios.sql en Supabase?"); }
  }
  else if (a === "import"){ $("#imp-file").click(); }
  else if (a === "logout"){ arm(b, "¿Cerrar sesión? Toca otra vez", async () => { await Store.signOut(); draft = newDraft(); LS.set("bh_draft", null); }); }
  /* rutinas */
  else if (a === "r-new"){ state.editing = {id: uid("r"), nombre: "", creada: new Date().toISOString(), dias: [{nombre: "Día 1", ejercicios: []}]}; renderAll(); window.scrollTo(0, 0); }
  else if (a === "r-edit"){ const r = state.routines.find(x => x.id === b.dataset.id); if (!r) return; state.editing = clone(r); state.editing.dias = state.editing.dias || []; state.editing.dias.forEach(d => d.ejercicios = d.ejercicios || []); renderAll(); window.scrollTo(0, 0); }
  else if (a === "r-dup"){
    const r = state.routines.find(x => x.id === b.dataset.id); if (!r) return;
    const c = clone(r); delete c.id; c.nombre = (r.nombre || "Rutina") + " (copia)"; c.creada = new Date().toISOString();
    try { await Store.save("rutinas", uid("r"), c); toast("Rutina duplicada"); } catch(err){ toast("No se pudo duplicar."); }
  }
  else if (a === "r-del"){
    arm(b, "¿Eliminar? Toca otra vez", async () => {
      try { await Store.remove("rutinas", b.dataset.id); if (state.config.rutinaActiva === b.dataset.id) await Store.saveConfig({rutinaActiva: null}); toast("Rutina eliminada"); }
      catch(err){ toast("No se pudo eliminar."); }
    });
  }
  else if (a === "r-activate"){ try { await Store.saveConfig({rutinaActiva: b.dataset.id}); toast("Rutina activa"); } catch(err){ toast("No se pudo cambiar."); } }
  else if (a === "r-cancel"){ state.editing = null; renderAll(); }
  else if (a === "r-save"){
    const r = state.editing;
    r.nombre = (r.nombre || "").trim() || "Mi rutina";
    r.dias = r.dias.map((d, i) => ({nombre: (d.nombre || "").trim() || "Día " + (i + 1), ejercicios: d.ejercicios.map(x => {
      const series = Math.max(1, Math.round(x.series || 3)), repMin = Math.max(1, Math.round(x.repMin || 8)), repMax = Math.max(repMin, Math.round(x.repMax || repMin));
      const o = {nombre: x.nombre, series, repMin, repMax, peso: x.peso ?? null, inc: x.inc ?? 2.5, unidad: x.unidad || "kg"};
      if (x.nota) o.nota = x.nota;
      if (x.maquina && x.maquina.trim()) o.maquina = x.maquina.trim();
      return o;
    })}));
    try {
      await Store.save("rutinas", r.id, r);
      if (!state.config.rutinaActiva || !state.routines.some(x => x.id === state.config.rutinaActiva)) await Store.saveConfig({rutinaActiva: r.id});
      state.editing = null; toast("Rutina guardada"); renderAll();
    } catch(err){ toast("No se pudo guardar la rutina. Intenta de nuevo."); }
  }
  else if (a === "d-add"){ state.editing.dias.push({nombre: "Día " + (state.editing.dias.length + 1), ejercicios: []}); renderAll(); }
  else if (a === "d-del"){ arm(b, "¿Quitar día?", () => { state.editing.dias.splice(+b.dataset.d, 1); renderAll(); }); }
  else if (a === "d-up" || a === "d-down"){ move(state.editing.dias, +b.dataset.d, a === "d-up" ? -1 : 1); renderAll(); }
  else if (a === "e-add"){
    const di = +b.dataset.d;
    openPicker((name, cat) => {
      state.editing.dias[di].ejercicios.push({nombre: name, series: 3, repMin: 8, repMax: 12, peso: null, inc: cat ? cat.inc : 2.5, unidad: "kg"});
      renderAll();
    });
  }
  else if (a === "e-del"){ state.editing.dias[+b.dataset.d].ejercicios.splice(+b.dataset.e, 1); renderAll(); }
  else if (a === "e-up" || a === "e-down"){ move(state.editing.dias[+b.dataset.d].ejercicios, +b.dataset.e, a === "e-up" ? -1 : 1); renderAll(); }
  /* cuerpo */
  else if (a === "b-save"){ saveBody(); }
  else if (a === "b-del"){ arm(b, "¿Borrar?", async () => { try { await Store.remove("cuerpo", b.dataset.id); toast("Registro borrado"); } catch(err){ toast("No se pudo borrar."); } }); }
  /* metas */
  else if (a === "gtipo"){ goalForm.tipo = b.dataset.v; renderAll(); }
  else if (a === "goal-add"){ addGoal(); }
  else if (a === "goal-toggle"){
    const g = state.goals.find(x => x.id === b.dataset.id); if (!g) return;
    await Store.save("metas", g.id, Object.assign({}, g, {completada: !g.completada}));
  }
  else if (a === "goal-del"){
    arm(b, "¿Eliminar?", async () => { try { await Store.remove("metas", b.dataset.id); toast("Meta eliminada"); } catch(err){ toast("No se pudo eliminar."); } });
  }
});

async function addGoal(){
  const tp = goalForm.tipo, dl = ($("#g-dl") || {}).value || "";
  const g = {tipo: tp, fecha_limite: dl, creada: new Date().toISOString(), completada: false};
  if (tp === "peso"){
    const ex = ($("#g-ex").value || "").trim(), obj = num($("#g-obj").value);
    if (!ex || !obj){ toast("Escribe el ejercicio y el peso objetivo"); return; }
    const lm = lastMeta(ex); g.unidad = lm ? lm.unidad : "kg";
    const h = historyFor(ex).filter(x => x.unidad === g.unidad); g.ejercicio = knownNames().get(key(ex)) || ex; g.objetivo = obj; g.inicio = h.length ? Math.max(...h.map(x => x.max)) : 0;
  } else if (tp === "mes"){
    const obj = Math.round(num($("#g-obj").value) || 0);
    if (!obj){ toast("Escribe cuántos días"); return; }
    g.objetivo = obj;
  } else {
    const t = ($("#g-tit").value || "").trim(); if (!t){ toast("Escribe tu meta"); return; }
    g.titulo = t;
  }
  try { await Store.save("metas", uid("g"), g); toast("Meta creada"); renderAll(); }
  catch(e){ toast("No se pudo guardar la meta. Intenta de nuevo."); }
}

async function exportCSV(){
  const rows = [["fecha","tipo_dia","asistio","ejercicio","maquina","numero_serie","peso","unidad","repeticiones","sensacion","notas"]];
  for (const s of sorted()){
    const ex = s.ejercicios || [];
    if (!ex.length) rows.push([s.fecha, s.tipo_dia, s.asistio !== false, "", "", "", "", "", "", "", s.notas || ""]);
    for (const e of ex) (e.series || []).forEach((x, i) => rows.push([s.fecha, s.tipo_dia, s.asistio !== false, e.nombre, e.maquina || "", i + 1, x.peso, e.unidad || "kg", x.reps, x.esfuerzo ? EFFL[x.esfuerzo] : "", i === 0 ? (s.notas || "") : ""]));
  }
  const csv = rows.map(r => r.map(c => { const v = String(c ?? ""); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(",")).join("\n");
  downloadFile("gym-" + today() + ".csv", "﻿" + csv, "text/csv;charset=utf-8");
}
function downloadFile(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportBackup(){ downloadFile("bitacora-respaldo-" + today() + ".json", JSON.stringify({app: "bitacora-de-hierro", version: 1, filas: Store.snapshot()}, null, 1), "application/json"); }
async function importBackup(file){
  try {
    const j = JSON.parse(await file.text());
    const n = await Store.importRows(Array.isArray(j) ? j : j.filas || []);
    toast(`Respaldo importado: ${n} registros`); renderAll();
  } catch(e){ toast("No se pudo importar. Revisa que sea un respaldo de esta app."); }
}

/* ---------- inicio ---------- */
if (!draftHasContent() && draft.fecha !== today()) { draft = newDraft(); LS.set("bh_draft", draft); }
if (draftHasContent()) draftStatus = "saved";
if (state.tab === "rutinas") state.editing = null;
renderAll();
Store.init().then(() => { if (draftHasContent()) saveDraft(false); });
})();
</script>
